name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: ruff + pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Create venv and install
        run: |
          uv venv .venv --python ${{ matrix.python }}
          uv pip install --python .venv/bin/python -e ".[dev]"
      - name: Ruff (integrations, examples)
        run: |
          .venv/bin/ruff check airt/integrations examples
          .venv/bin/ruff format --check airt/integrations examples
      - name: Ruff (whole tree, advisory until the core is lint clean)
        continue-on-error: true
        run: .venv/bin/ruff check airt tests
      - name: Pytest
        env:
          AIRT_SECRET_KEY: ci-only-secret-key-not-for-production
          AIRT_LOG_JSON_CONSOLE: "true"
        run: .venv/bin/python -m pytest -q
      - name: Import integrations without optional extras
        run: .venv/bin/python -c "import airt.integrations.python_sdk, airt.integrations.mitm_addon"

  node:
    name: node sdk self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node sdk/node/test.js

  docker:
    name: docker build
    runs-on: ubuntu-latest
    needs: [python]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: airt:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
