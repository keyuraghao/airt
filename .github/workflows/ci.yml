name: CI

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # manual dispatches get their own group so they never cancel a push-triggered run of the same ref
  group: ci-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  UV_SYSTEM_PYTHON: "0"

jobs:
  style:
    name: style guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: No em dashes anywhere in the tree
        shell: bash
        run: |
          # Byte sequence of U+2014 so this file never has to contain the character itself.
          if grep -rnI --exclude-dir=.venv --exclude-dir=node_modules --exclude-dir=.git $'\xe2\x80\x94' .; then
            echo "::error::em dash character found, use a hyphen or a comma"
            exit 1
          fi
          echo "no em dashes found"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Style and merge-marker guard
        run: python scripts/check_style.py
      - name: Ruff on scripts
        run: |
          python -m pip install --quiet "ruff>=0.5"
          python -m ruff check scripts
      - name: Ruff format check on scripts
        continue-on-error: false
        run: python -m ruff format --check scripts

  python:
    name: ruff + pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - name: Create venv and install
        run: |
          uv venv .venv --python ${{ matrix.python }}
          uv pip install --python .venv/bin/python -e ".[dev,codereview]" pytest-cov
      - name: Ruff check (strict)
        continue-on-error: false
        run: .venv/bin/ruff check --output-format=github aisrf tests examples
      - name: Ruff format check
        continue-on-error: false
        run: .venv/bin/ruff format --check aisrf tests examples
      - name: Pytest with coverage
        env:
          AISRF_SECRET_KEY: ci-only-secret-key-not-for-production
          AISRF_LOG_JSON_CONSOLE: "true"
        run: |
          .venv/bin/python -m pytest -q \
            --cov=aisrf --cov-branch \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage.xml \
            --junitxml=pytest-junit.xml
      - name: Coverage summary
        if: always()
        run: |
          echo "## Coverage (py${{ matrix.python }})" >> "$GITHUB_STEP_SUMMARY"
          .venv/bin/python -m coverage report --format=markdown --skip-covered >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python }}
          path: |
            coverage.xml
            pytest-junit.xml
          retention-days: 14
          if-no-files-found: warn
      - name: Import integrations without optional extras
        run: .venv/bin/python -c "import aisrf.integrations.python_sdk, aisrf.integrations.mitm_addon"
      - name: CLI smoke test
        run: |
          .venv/bin/aisrf version
          .venv/bin/aisrf --help > /dev/null

  binary-smoke:
    # PyInstaller build of the Linux binary plus the smoke test in scripts/build_binary.py,
    # so a missing hidden import or data file is caught before a release is tagged.
    name: binary smoke (linux x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [python]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - name: Create venv and install with PyInstaller
        run: |
          uv venv .venv --python 3.12
          uv pip install --python .venv/bin/python -e . pyinstaller
      - name: Build and smoke test
        run: .venv/bin/python scripts/build_binary.py --skip-archive
      - name: Bundle size
        run: du -sh dist/aisrf >> "$GITHUB_STEP_SUMMARY"

  heavy-extras:
    # garak, PyRIT, LLM Guard and NeMo pull multi-gigabyte ML dependencies; run on demand or weekly.
    name: heavy extras (scanners + guardrails)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Create venv and install everything
        run: |
          uv venv .venv --python 3.12
          uv pip install --python .venv/bin/python -e ".[dev,all]"
      - name: Scanner and guardrail tests
        env:
          AISRF_SECRET_KEY: ci-only-secret-key-not-for-production-use
        run: .venv/bin/python -m pytest tests/test_scanners.py tests/test_guardrails.py tests/test_codereview.py -q

  node:
    name: node sdk self-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node sdk/node/test.js
      - name: Package dry run
        working-directory: sdk/node
        run: npm pack --dry-run

  docker:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [python]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: aisrf:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run --rm aisrf:ci version
          docker run --rm -e AISRF_SECRET_KEY=ci-only-secret-key-not-for-production aisrf:ci init-db
