# docker compose up -d                      -> gateway on http://localhost:8080 with SQLite in the aisrf-data volume
# docker compose --profile postgres up -d   -> gateway + PostgreSQL (set AISRF_DATABASE_URL in .env, see below)
services:
  gateway:
    build: .
    image: aisrf:latest
    container_name: aisrf-gateway
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      AISRF_HOST: 0.0.0.0
      AISRF_PORT: "8080"
      AISRF_DATA_DIR: /app/data
      AISRF_LOG_DIR: /app/logs
      AISRF_LOG_JSON_CONSOLE: "true"
      # Uncomment (or set in .env) to use the postgres service instead of SQLite:
      # AISRF_DATABASE_URL: postgresql+asyncpg://aisrf:aisrf@postgres:5432/aisrf
    ports:
      - "${AISRF_BIND_ADDRESS:-127.0.0.1}:${AISRF_PORT:-8080}:8080"
    volumes:
      - aisrf-data:/app/data
      - aisrf-logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  postgres:
    image: postgres:16-alpine
    container_name: aisrf-postgres
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aisrf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aisrf}
      POSTGRES_DB: ${POSTGRES_DB:-aisrf}
    volumes:
      - aisrf-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aisrf} -d ${POSTGRES_DB:-aisrf}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  aisrf-data:
  aisrf-logs:
  aisrf-pgdata:
