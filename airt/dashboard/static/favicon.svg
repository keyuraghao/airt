  <g fill="#FFFFFF">
    <rect x="17" y="0" width="6" height="11"/>
    <rect x="29" y="0" width="6" height="11"/>
    <rect x="41" y="0" width="6" height="11"/>
  </g>
  <g transform="translate(32 36) rotate(45)">
    <polygon points="0,-23 -10,0 10,0" fill="#22D3EE"/>
    <polygon points="0,23 -10,0 10,0" fill="#F59E0B"/>
  </g>
  <circle cx="32" cy="36" r="5" fill="#0B1220"/>
</svg>
