<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Airt">
  <title>Airt favicon</title>
  <!-- Simplified mark for 16 to 32 px: solid navy tile, needle, pivot dot -->
