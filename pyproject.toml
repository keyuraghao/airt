[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airt"
version = "1.0.0"
description = "AIRT - AI Security & Research Framework: human-in-the-loop interception, analysis and red teaming for LLM traffic"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  "httpx>=0.27",
  "structlog>=24",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "typer>=0.12",
  "rich>=13",
  "itsdangerous>=2.2",
  "sse-starlette>=2.1",
  "orjson>=3.12.0",
  "pyyaml>=6",
  "cryptography>=42",
  "mcp>=2.0",
  "reportlab>=4",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
mitm = ["mitmproxy>=10"]
guardrails = ["llm-guard>=0.3", "nemoguardrails>=0.10", "rebuff>=0.0.5"]
scanners = ["garak>=0.10", "pyrit>=0.5"]
all = ["asyncpg>=0.29", "mitmproxy>=10", "llm-guard>=0.3", "nemoguardrails>=0.10", "rebuff>=0.0.5", "garak>=0.10", "pyrit>=0.5"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "asgi-lifespan>=2"]

[project.scripts]
airt = "airt.cli:app"

[tool.setuptools.packages.find]
include = ["airt*"]

[tool.setuptools.package-data]
airt = ["dashboard/templates/*.html", "dashboard/static/*", "redteam/corpus/*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["docs/images", "sdk", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PIE", "T20"]
ignore = [
  "B008",    # FastAPI Depends() in defaults is the framework idiom
  "E501",    # line length is handled by the formatter
  "RUF012",  # mutable class attributes are used deliberately for pydantic models
  "SIM108",  # ternaries are not always clearer
  "B904",    # exception chaining is not required in request handlers
  "RUF001", "RUF002", "RUF003",  # analyzers intentionally contain confusable unicode in detection patterns
  "T201",    # the CLI prints
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "F401", "B011", "F841", "RUF018", "SIM117", "PIE"]
"examples/*" = ["E402", "T20"]
"airt/analysis/analyzers/*" = ["RUF001", "RUF002", "RUF003", "E741", "PLE2515"]
