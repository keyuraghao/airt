{% extends "base.html" %}
{% block content %}
<div class="page-head">
  <h1>Audit log</h1>
  <span class="hint">tamper evident, each entry hashes the previous one</span>
  <span class="spacer"></span>
  <input type="text" id="f-action" placeholder="action, e.g. ticket.approve">
  <input type="text" id="f-actor" placeholder="actor">
  <button class="btn sm" id="apply-btn">Apply</button>
  <button class="btn primary" id="verify-btn">Verify chain</button>
</div>
<div id="verify-result" class="mb"></div>
<div class="card pad-0">
  <div class="table-wrap">
    <table>
      <thead><tr><th>#</th><th>Time</th><th>Actor</th><th>Action</th><th>Target</th><th>Detail</th><th>Prev hash</th><th>Hash</th></tr></thead>
      <tbody id="audit-rows"></tbody>
    </table>
  </div>
  <div class="flex" id="pager" style="padding:10px 16px"></div>
</div>
{% endblock %}
{% block scripts %}<script src="/static/audit.js"></script>{% endblock %}
