{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="card login-card">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 4l10 4v8c0 6-4.5 10.5-10 12C10.5 26.5 6 22 6 16V8l10-4z" fill="none" stroke="#4f8cff" stroke-width="2.2"/><path d="M11 17l3.5 3.5L21 13" fill="none" stroke="#ef5a5a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>{{ app_name }}</span>
    </div>
    <p class="muted">Sign in with your reviewer account.</p>
    <form id="login-form" class="stack" autocomplete="on">
      <input type="hidden" id="next" value="{{ next }}">
      <label class="field">Username<input type="text" id="username" name="username" required autofocus autocomplete="username"></label>
      <label class="field">Password<input type="password" id="password" name="password" required autocomplete="current-password"></label>
      <div id="login-error" class="error-box hidden" role="alert"></div>
      <button type="submit" class="btn primary lg" id="login-btn">Sign in</button>
    </form>
    <p class="hint mt">v{{ version }}</p>
  </div>
</div>
{% endblock %}
{% block scripts %}<script src="/static/login.js"></script>{% endblock %}
