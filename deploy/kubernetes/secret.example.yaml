# Copy to secret.yaml, replace every value, apply, and never commit the copy.
apiVersion: v1
kind: Secret
metadata:
  name: aisrf-env
  labels:
    app.kubernetes.io/name: aisrf
type: Opaque
stringData:
  AISRF_SECRET_KEY: "replace-with-python3-c-import-secrets-print-secrets.token_urlsafe-48"
  AISRF_ADMIN_PASSWORD: "replace-me"
  AISRF_ADMIN_API_TOKEN: "replace-with-a-long-random-token"
  # Optional: PostgreSQL instead of the SQLite file on the PVC (needed for more than one replica).
  # AISRF_DATABASE_URL: "postgresql+asyncpg://aisrf:secret@postgres.aisrf.svc:5432/aisrf?ssl=require"
  # Optional: explicit Fernet key for stored upstream credentials.
  # AISRF_ENCRYPTION_KEY: ""
