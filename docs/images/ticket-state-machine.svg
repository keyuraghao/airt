<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="780" viewBox="0 0 1500 780" font-family="Liberation Sans, Arial, Helvetica, sans-serif">
<title>AISRF ticket state machine</title>
<defs><marker id="arw2dd4bf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2dd4bf"/></marker><marker id="arw2dd4bfs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 10 0 L 0 5 L 10 10 z" fill="#2dd4bf"/></marker><marker id="arwa78bfa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a78bfa"/></marker><marker id="arwa78bfas" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 10 0 L 0 5 L 10 10 z" fill="#a78bfa"/></marker><marker id="arwcbd5e1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#cbd5e1"/></marker><marker id="arwcbd5e1s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 10 0 L 0 5 L 10 10 z" fill="#cbd5e1"/></marker><marker id="arwfb923c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fb923c"/></marker><marker id="arwfb923cs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 10 0 L 0 5 L 10 10 z" fill="#fb923c"/></marker><marker id="arwfbbf24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/></marker><marker id="arwfbbf24s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 10 0 L 0 5 L 10 10 z" fill="#fbbf24"/></marker></defs>
<rect x="0" y="0" width="1500" height="780" rx="18" ry="18" fill="#0f172a"/>
<text x="32" y="44" font-size="24" font-weight="bold" fill="#e5e7eb">AISRF ticket state machine</text>
<text x="32" y="66" font-size="13" fill="#a3adbd">aisrf.models.TicketStatus and the transitions in aisrf/tickets/service.py. Only PENDING tickets can be decided (409 otherwise).</text>
<rect x="50.0" y="310.0" width="130.0" height="40.0" rx="20" ry="20" fill="#162036" stroke="#334155" stroke-width="1.5" opacity="1.0"/>
<text x="115.0" y="335.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="normal" opacity="1.0">request received</text>
<path d="M 180.0 330.0 L 205.0 330.0" fill="none" stroke="#cbd5e1" stroke-width="1.8" marker-end="url(#arwcbd5e1)"/>
<path d="M 395.0 310.0 L 645.0 170.0" fill="none" stroke="#2dd4bf" stroke-width="1.8" marker-end="url(#arw2dd4bf)"/>
<path d="M 395.0 335.0 L 645.0 195.0" fill="none" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#arwfbbf24)"/>
<path d="M 395.0 350.0 L 645.0 505.0" fill="none" stroke="#2dd4bf" stroke-width="1.8" marker-end="url(#arw2dd4bf)"/>
<path d="M 380.0 367.0 L 645.0 530.0" fill="none" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#arwfbbf24)"/>
<path d="M 300.0 367.0 L 300.0 573.0" fill="none" stroke="#fb923c" stroke-width="1.8" marker-end="url(#arwfb923c)"/>
<path d="M 835.0 170.0 L 985.0 170.0" fill="none" stroke="#cbd5e1" stroke-width="1.8" marker-end="url(#arwcbd5e1)"/>
<path d="M 1175.0 156.0 L 1265.0 104.0" fill="none" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#arwa78bfa)"/>
<path d="M 1175.0 184.0 L 1265.0 256.0" fill="none" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#arwa78bfa)"/>
<rect x="375.0" y="148.0" width="194.8" height="46.9" rx="4" ry="4" fill="#0f172a" stroke="#0f172a" stroke-width="0" opacity="0.92"/>
<text x="380.0" y="160.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#e5e7eb" text-anchor="start" font-weight="normal" opacity="1.0">policy: approve</text>
<text x="380.0" y="174.3" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#e5e7eb" text-anchor="start" font-weight="normal" opacity="1.0">require_approval=false or</text>
<text x="380.0" y="188.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#e5e7eb" text-anchor="start" font-weight="normal" opacity="1.0">risk &lt; auto_approve_below_risk</text>
<rect x="555.0" y="273.0" width="139.4" height="32.6" rx="4" ry="4" fill="#0f172a" stroke="#0f172a" stroke-width="0" opacity="0.92"/>
<text x="560.0" y="285.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#e5e7eb" text-anchor="start" font-weight="normal" opacity="1.0">reviewer: approve</text>
<text x="560.0" y="299.3" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#e5e7eb" text-anchor="start" font-weight="normal" opacity="1.0">dashboard / MCP / CLI</text>
<rect x="555.0" y="368.0" width="274.9" height="46.9" rx="4" ry="4" fill="#0f172a" stroke="#0f172a" stroke-width="0" opacity="0.92"/>
<text x="560.0" y="380.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#e5e7eb" text-anchor="start" font-weight="normal" opacity="1.0">policy: deny</text>
<text x="560.0" y="394.3" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#e5e7eb" text-anchor="start" font-weight="normal" opacity="1.0">path/model not allowed, deny regex,</text>
<text x="560.0" y="408.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#e5e7eb" text-anchor="start" font-weight="normal" opacity="1.0">custom deny rule, risk &gt;= auto_deny_at_risk</text>
<rect x="425.0" y="508.0" width="170.2" height="18.3" rx="4" ry="4" fill="#0f172a" stroke="#0f172a" stroke-width="0" opacity="0.92"/>
<text x="430.0" y="520.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#e5e7eb" text-anchor="start" font-weight="normal" opacity="1.0">reviewer: deny (with note)</text>
<rect x="39.8" y="458.0" width="250.2" height="32.6" rx="4" ry="4" fill="#0f172a" stroke="#0f172a" stroke-width="0" opacity="0.92"/>
<text x="285.0" y="470.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#e5e7eb" text-anchor="end" font-weight="normal" opacity="1.0">timeout: background sweeper (every 5 s)</text>
<text x="285.0" y="484.3" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#e5e7eb" text-anchor="end" font-weight="normal" opacity="1.0">or the hold wait reaching expires_at</text>
<rect x="855.0" y="126.5" width="110.0" height="45.0" rx="4" ry="4" fill="#0f172a" stroke="#0f172a" stroke-width="0" opacity="0.92"/>
<text x="910.0" y="138.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10.5" fill="#e5e7eb" text-anchor="middle" font-weight="normal" opacity="1.0">forward_ticket()</text>
<text x="910.0" y="151.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10.5" fill="#e5e7eb" text-anchor="middle" font-weight="normal" opacity="1.0">sync: now; async:</text>
<text x="910.0" y="165.3" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10.5" fill="#e5e7eb" text-anchor="middle" font-weight="normal" opacity="1.0">on the first poll</text>
<rect x="1142.6" y="83.0" width="114.7" height="18.3" rx="4" ry="4" fill="#0f172a" stroke="#0f172a" stroke-width="0" opacity="0.92"/>
<text x="1200.0" y="95.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#e5e7eb" text-anchor="middle" font-weight="normal" opacity="1.0">upstream answered</text>
<rect x="1113.4" y="263.0" width="133.2" height="18.3" rx="4" ry="4" fill="#0f172a" stroke="#0f172a" stroke-width="0" opacity="0.92"/>
<text x="1180.0" y="275.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#e5e7eb" text-anchor="middle" font-weight="normal" opacity="1.0">upstream error / 5xx</text>
<rect x="205.0" y="293.0" width="190.0" height="74.0" rx="16" ry="16" fill="#7c2d12" stroke="#fb923c" stroke-width="2" opacity="1.0"/>
<text x="300.0" y="319.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#e5e7eb" text-anchor="middle" font-weight="bold" opacity="1.0">PENDING</text>
<text x="300.0" y="337.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#d1d5db" text-anchor="middle" font-weight="normal" opacity="1.0">waiting for a decision</text>
<text x="300.0" y="351.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#d1d5db" text-anchor="middle" font-weight="normal" opacity="1.0">expires_at = now + 300 s</text>
<rect x="645.0" y="133.0" width="190.0" height="74.0" rx="16" ry="16" fill="#14532d" stroke="#4ade80" stroke-width="2" opacity="1.0"/>
<text x="740.0" y="159.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#e5e7eb" text-anchor="middle" font-weight="bold" opacity="1.0">APPROVED</text>
<text x="740.0" y="177.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#d1d5db" text-anchor="middle" font-weight="normal" opacity="1.0">decided, not yet forwarded</text>
<rect x="645.0" y="483.0" width="190.0" height="74.0" rx="16" ry="16" fill="#7f1d1d" stroke="#f87171" stroke-width="2" opacity="1.0"/>
<text x="740.0" y="509.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#e5e7eb" text-anchor="middle" font-weight="bold" opacity="1.0">DENIED</text>
<text x="740.0" y="527.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#d1d5db" text-anchor="middle" font-weight="normal" opacity="1.0">client gets 403</text>
<text x="740.0" y="541.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#d1d5db" text-anchor="middle" font-weight="normal" opacity="1.0">nothing sent upstream</text>
<rect x="205.0" y="573.0" width="190.0" height="74.0" rx="16" ry="16" fill="#7f1d1d" stroke="#f87171" stroke-width="2" opacity="1.0"/>
<text x="300.0" y="599.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#e5e7eb" text-anchor="middle" font-weight="bold" opacity="1.0">EXPIRED</text>
<text x="300.0" y="617.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#d1d5db" text-anchor="middle" font-weight="normal" opacity="1.0">client gets 504</text>
<text x="300.0" y="631.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#d1d5db" text-anchor="middle" font-weight="normal" opacity="1.0">nothing sent upstream</text>
<rect x="985.0" y="133.0" width="190.0" height="74.0" rx="16" ry="16" fill="#4c1d95" stroke="#a78bfa" stroke-width="2" opacity="1.0"/>
<text x="1080.0" y="159.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#e5e7eb" text-anchor="middle" font-weight="bold" opacity="1.0">FORWARDING</text>
<text x="1080.0" y="177.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#d1d5db" text-anchor="middle" font-weight="normal" opacity="1.0">request in flight upstream</text>
<text x="1080.0" y="191.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#d1d5db" text-anchor="middle" font-weight="normal" opacity="1.0">canary + credential swap done</text>
<rect x="1265.0" y="53.0" width="190.0" height="74.0" rx="16" ry="16" fill="#14532d" stroke="#4ade80" stroke-width="2" opacity="1.0"/>
<text x="1360.0" y="79.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#e5e7eb" text-anchor="middle" font-weight="bold" opacity="1.0">COMPLETED</text>
<text x="1360.0" y="97.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#d1d5db" text-anchor="middle" font-weight="normal" opacity="1.0">upstream status &lt; 500</text>
<text x="1360.0" y="111.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#d1d5db" text-anchor="middle" font-weight="normal" opacity="1.0">response analysed, relayed</text>
<rect x="1265.0" y="233.0" width="190.0" height="74.0" rx="16" ry="16" fill="#7f1d1d" stroke="#f87171" stroke-width="2" opacity="1.0"/>
<text x="1360.0" y="259.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#e5e7eb" text-anchor="middle" font-weight="bold" opacity="1.0">FAILED</text>
<text x="1360.0" y="277.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#d1d5db" text-anchor="middle" font-weight="normal" opacity="1.0">network error or status &gt;= 500</text>
<text x="1360.0" y="291.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#d1d5db" text-anchor="middle" font-weight="normal" opacity="1.0">client gets 502</text>
<rect x="880.0" y="340.0" width="580.0" height="200.0" rx="12" ry="12" fill="#162036" stroke="#334155" stroke-width="1.5" opacity="1.0"/>
<text x="896.0" y="366.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#e5e7eb" text-anchor="start" font-weight="bold" opacity="1.0">Invariants</text>
<text x="896.0" y="390.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" fill="#d1d5db" text-anchor="start" font-weight="normal" opacity="1.0">- decide() raises InvalidTransition (HTTP 409) unless the ticket is PENDING.</text>
<text x="896.0" y="405.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" fill="#d1d5db" text-anchor="start" font-weight="normal" opacity="1.0">- DENIED and EXPIRED tickets never reach the provider; APPROVED is the only path to FORWARDING.</text>
<text x="896.0" y="420.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" fill="#d1d5db" text-anchor="start" font-weight="normal" opacity="1.0">- Every transition writes a ticket_events row, a per-agent log line and an SSE event;</text>
<text x="896.0" y="435.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" fill="#d1d5db" text-anchor="start" font-weight="normal" opacity="1.0">  human decisions also append a hash-chained audit entry.</text>
<text x="896.0" y="450.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" fill="#d1d5db" text-anchor="start" font-weight="normal" opacity="1.0">- hold_registry.resolve() wakes a blocked sync request in-process; other processes see the</text>
<text x="896.0" y="465.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" fill="#d1d5db" text-anchor="start" font-weight="normal" opacity="1.0">  new status on their next DB poll (AISRF_HOLD_POLL_INTERVAL_SECONDS).</text>
<text x="896.0" y="480.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" fill="#d1d5db" text-anchor="start" font-weight="normal" opacity="1.0">- Async clients poll /gateway/tickets/{id}: 202 PENDING, 403 DENIED / EXPIRED, 502 FAILED,</text>
<text x="896.0" y="495.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" fill="#d1d5db" text-anchor="start" font-weight="normal" opacity="1.0">  200 {status: COMPLETED, response} once relayed.</text>
<text x="896.0" y="510.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" fill="#d1d5db" text-anchor="start" font-weight="normal" opacity="1.0">- Red-team probes are ordinary tickets (source=redteam) and follow the same machine.</text>
<rect x="32.0" y="700.0" width="1270.0" height="52.0" rx="10" ry="10" fill="#162036" stroke="#334155" stroke-width="1.5" opacity="1.0"/>
<text x="44.0" y="719.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#a3adbd" text-anchor="start" font-weight="bold" opacity="1.0">Who triggers the transition</text>
<path d="M 46 737 L 74 737" fill="none" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arw2dd4bf)"/>
<text x="86.0" y="741.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#e5e7eb" text-anchor="start" font-weight="normal" opacity="1.0">policy engine</text>
<path d="M 296 737 L 324 737" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arwfbbf24)"/>
<text x="336.0" y="741.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#e5e7eb" text-anchor="start" font-weight="normal" opacity="1.0">human reviewer</text>
<path d="M 546 737 L 574 737" fill="none" stroke="#fb923c" stroke-width="2" marker-end="url(#arwfb923c)"/>
<text x="586.0" y="741.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#e5e7eb" text-anchor="start" font-weight="normal" opacity="1.0">timeout sweeper / hold deadline</text>
<path d="M 796 737 L 824 737" fill="none" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arwcbd5e1)"/>
<text x="836.0" y="741.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#e5e7eb" text-anchor="start" font-weight="normal" opacity="1.0">gateway</text>
<path d="M 1046 737 L 1074 737" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arwa78bfa)"/>
<text x="1086.0" y="741.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#e5e7eb" text-anchor="start" font-weight="normal" opacity="1.0">upstream result</text>
</svg>