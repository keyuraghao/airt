<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Airt logo mark">
  <title>Airt mark</title>
  <!-- Gate frame -->
  <rect x="5" y="5" width="54" height="54" rx="13" fill="none" stroke="#0B1220" stroke-width="5"/>
  <!-- Portcullis teeth hanging from the lintel -->
  <g fill="#0B1220">
    <polygon points="18,6 22,6 22,12 20,16 18,12"/>
    <polygon points="30,6 34,6 34,12 32,16 30,12"/>
    <polygon points="42,6 46,6 46,12 44,16 42,12"/>
  </g>
  <!-- Compass needle: teal north half (approved), amber south half (pending review) -->
  <g transform="translate(32 37) rotate(45)">
    <polygon points="0,-20 -8.5,0 8.5,0" fill="#22D3EE"/>
    <polygon points="0,20 -8.5,0 8.5,0" fill="#F59E0B"/>
  </g>
  <!-- Pivot with human-approval check -->
  <circle cx="32" cy="37" r="5.8" fill="#FFFFFF"/>
  <path d="M29 37.2 L31.3 39.5 L35.2 35.1" fill="none" stroke="#0B1220" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
