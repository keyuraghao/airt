<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="AISRF: every AI request, reviewed by a human before it reaches your backend">
  <title>AISRF social preview</title>
  <defs>
    <radialGradient id="glow" cx="0.28" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="640" fill="#0B1220"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <rect x="0" y="0" width="1280" height="6" fill="#1E293B"/>
  <!-- Mark, 320 px box -->
  <g transform="translate(136 160) scale(5)">
    <!-- The beam: a request in flight, with a human-shaped notch cut out of it -->
    <path fill="#FFFFFF" fill-rule="evenodd" d="M9 15 H55 A4 4 0 0 1 59 19 V45 A4 4 0 0 1 55 49 H9 A4 4 0 0 1 5 45 V19 A4 4 0 0 1 9 15 Z M21.5 49 V43 A10.5 10.5 0 0 1 42.5 43 V49 Z"/>
    <!-- The human standing in the beam -->
    <circle cx="32" cy="25" r="5.4" fill="#F59E0B"/>
  </g>
  <g font-family="Inter, 'Segoe UI', 'Noto Sans', Roboto, Helvetica, Arial, sans-serif">
    <text x="476" y="292" font-size="150" font-weight="700" letter-spacing="5" fill="#FFFFFF">AISRF</text>
    <text x="484" y="344" font-size="22" font-weight="600" letter-spacing="5" fill="#22D3EE">AI SECURITY &amp; RESEARCH FRAMEWORK</text>
    <rect x="484" y="374" width="56" height="4" rx="2" fill="#F59E0B"/>
    <text x="484" y="426" font-size="32" font-weight="500" fill="#FFFFFF" fill-opacity="0.85">Every AI request, reviewed by a human</text>
    <text x="484" y="470" font-size="32" font-weight="500" fill="#FFFFFF" fill-opacity="0.85">before it reaches your backend</text>
  </g>
</svg>
