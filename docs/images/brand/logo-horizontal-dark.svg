<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 478 128" width="478" height="128" role="img" aria-label="AISRF, AI Security &amp; Research Framework (reversed)">
  <title>AISRF horizontal logo</title>
  <!-- Mark, 96 px box -->
  <g transform="translate(16 16) scale(1.5)">
    <!-- The beam: a request in flight, with a human-shaped notch cut out of it -->
    <path fill="#FFFFFF" fill-rule="evenodd" d="M9 15 H55 A4 4 0 0 1 59 19 V45 A4 4 0 0 1 55 49 H9 A4 4 0 0 1 5 45 V19 A4 4 0 0 1 9 15 Z M21.5 49 V43 A10.5 10.5 0 0 1 42.5 43 V49 Z"/>
    <!-- The human standing in the beam -->
    <circle cx="32" cy="25" r="5.4" fill="#F59E0B"/>
  </g>
  <!-- Wordmark and descriptor -->
  <g font-family="Inter, 'Segoe UI', 'Noto Sans', Roboto, Helvetica, Arial, sans-serif">
    <text x="134" y="74" font-size="64" font-weight="700" letter-spacing="2.5" fill="#FFFFFF">AISRF</text>
    <text x="137" y="100" font-size="13" font-weight="600" letter-spacing="2.4" fill="#FFFFFF" fill-opacity="0.72">AI SECURITY &amp; RESEARCH FRAMEWORK</text>
  </g>
</svg>
